[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algerian-digital-id"
version = "0.1.0"
description = "Algerian Digital ID system"
requires-python = ">=3.7"

# ============================================================
# Pytest
# ============================================================
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
markers = [
    "asyncio: async tests",
    "slow: slow tests",
]

# ============================================================
# Black
# ============================================================
[tool.black]
line-length = 100
target-version = ["py37"]

# ============================================================
# isort
# ============================================================
[tool.isort]
profile = "black"
line-length = 100

# ============================================================
# Ruff
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py37"
select = ["E", "F", "W", "I"]
ignore = ["E501"]

# ============================================================
# Mypy
# ============================================================
[tool.mypy]
python_version = "3.7"
ignore_missing_imports = true
warn_unused_ignores = false

# ============================================================
# Coverage
# ============================================================
[tool.coverage.run]
source = ["app", "src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]